name: CodeQL

# CodeQL laeuft in BEIDEN Linien -- die Ergebnisse nehmen nur verschiedene
# Wege.
#
# Code Scanning ist auf oeffentlichen Repositories kostenlos. Auf privaten
# braeuchte es das Zusatzprodukt „Code Security" -- je aktivem Committer und
# Monat, und nur fuer Organisationen zu haben. Wer dieses Projekt in ein
# privates Repository uebernimmt, steht damit vor der Wahl, es zu kaufen oder
# auf CodeQL zu verzichten.
#
# Dieser Workflow braucht beides nicht: `analyze` schreibt die SARIF auch ohne
# Upload, `scripts/sarif-auswerten.mjs` liest sie und bricht bei Befunden ab.
# Ohne Code Scanning ist das sogar strenger -- ein Befund haelt den Zweig auf,
# statt einen Alert anzulegen, den man wegklicken kann.
#
# Der woechentliche Lauf ist kein Beiwerk: CodeQL-Regelsaetze werden laufend
# ergaenzt. Ein Befund kann in Code auftauchen, der sich seit Monaten nicht
# geaendert hat -- ohne Zeitplan saehe ihn niemand.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL
    # Actions-Minuten zaehlen nur auf privaten Repositories -- oeffentlich sind
    # sie unbegrenzt. CodeQL ist der teuerste Job hier und laeuft deshalb nur
    # dort. Was das kostet, ist benannt: Auf einem privaten Klon findet CodeQL
    # nichts mehr. Die uebrigen Pruefungen deckt `pnpm verify` lokal ab, eine
    # CodeQL-Analyse braucht dagegen die CLI und mehrere Minuten.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      # Zum Hochladen der Ergebnisse ins Code Scanning.
      security-events: write
      contents: read
      # Auf einem PRIVATEN Repository nicht verhandelbar: Dort fragt `analyze`
      # den Workflow-Lauf ueber die API ab und scheitert ohne dieses Recht mit
      # „Resource not accessible by integration" -- nach vollstaendiger Analyse
      # und geschriebener SARIF. Oeffentlich faellt es nicht auf, weil dort
      # mehr ohne eigenes Recht lesbar ist.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fuer die Auswertung unten. Im oeffentlichen Repository ungenutzt, aber
      # eine Bedingung dafuer waere teurer als der Schritt selbst.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          # Über den Standardsatz hinaus. Erzeugt mehr Befunde und mehr
          # Triage-Aufwand -- vertretbar, weil dieses Repository die
          # Sicherheitsprüfung selbst als Leistung ausweist.
          queries: security-extended

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:javascript-typescript"
          # Oeffentlich hochladen, privat nicht -- dort fehlt Advanced
          # Security, und der Versuch faerbte bisher den ganzen Job rot.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          # Geschrieben wird die SARIF in beiden Faellen. Der Standardpfad
          # liegt ausserhalb des Arbeitsverzeichnisses; hier ist er
          # ausgeschrieben, weil der naechste Schritt ihn liest.
          output: sarif

      # Nur ohne Code Scanning. Wo es zur Verfuegung steht, ist es die
      # Instanz, und ein Pull Request soll dort nicht an einem Befund
      # scheitern, den man nach Durchsicht begruendet schliessen will.
      # `!cancelled()` statt eines einfachen `if`: Scheitert `analyze` aus einem
      # Grund, der die SARIF unberuehrt laesst, sollen die Befunde trotzdem im
      # Protokoll stehen. Der Job bleibt in dem Fall ohnehin rot -- aber rot
      # mit Befundliste ist brauchbar, rot ohne ist nur eine Sackgasse.
      - name: Befunde auswerten
        if: ${{ !cancelled() && github.event.repository.private }}
        run: node scripts/sarif-auswerten.mjs sarif
