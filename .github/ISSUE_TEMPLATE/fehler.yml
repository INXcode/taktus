name: Fehler melden
description: Etwas verhält sich anders als beschrieben
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: >-
        **Sicherheitslücken und Datenschutzbefunde bitte nicht hier**, sondern
        über die private Meldung unter _Security_ — ohne GitHub-Konto per
        E-Mail an kontakt@inxsystems.de. Der Meldeweg steht in
        [SECURITY.md](https://github.com/INXcode/taktus/blob/main/SECURITY.md).

  - type: textarea
    id: beobachtung
    attributes:
      label: Was passiert
      description: Was hast du beobachtet, und was hattest du erwartet?
    validations:
      required: true

  - type: textarea
    id: schritte
    attributes:
      label: Schritte zur Nachstellung
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version oder Commit
      description: Steht im Fuß der Anwendung.
    validations:
      required: true

  - type: checkboxes
    id: keine_echtdaten
    attributes:
      label: Bestätigung
      options:
        - label: >-
            Meine Angaben enthalten keine echten personenbezogenen Daten —
            keine Namen, E-Mail-Adressen oder Kundenbezüge in Beschreibung,
            Protokollauszügen oder Bildschirmfotos.
          required: true
